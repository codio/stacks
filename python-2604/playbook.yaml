---
- hosts: 127.0.0.1
  become: true
  tasks:
    - name: Fail if Ubuntu version is less than 26
      fail:
        msg: "Ubuntu version must be 26 or higher"
      when: ansible_facts['distribution_major_version'] | int < 26

    - apt: update_cache=yes

    - name: Install python3, build-essential
      apt:
        name:
          - python3
          - python3-dev
          - python3-pip
          - python3-setuptools
          - python3-tk
          - ipython3
          - build-essential
          - python3-venv
          - python-is-python3
          - python3-numpy
          - python3-scipy
          - python3-matplotlib
          - python3-pycodestyle
          - python3-pygame
        state: present
        update_cache: yes
