---
- hosts: 127.0.0.1
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade glibc before other installs
      ansible.builtin.apt:
        name: [libc6, libc-bin, locales]
        state: latest
        only_upgrade: true

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - man
          - rsync
          - git
          - jq
          - htop
          - nano
          - tzdata-icu
          - openssh-server
          - gnupg2
          - python-is-python3
          - zsh
          - xz-utils
          - aria2
          - software-properties-common
        state: present

    - name: Enable ssh
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

    - name: Mask apt-daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Remove Ubuntu Advantage
      ansible.builtin.apt:
        name: ubuntu-advantage-tools
        state: absent
